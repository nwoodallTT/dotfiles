unbind C-b
set -g prefix `
bind ` send-prefix

set -g mouse on
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
setw -g mode-keys vi
bind ] paste-buffer

# copy-mode-vi: select within one pane, copy to Mac clipboard via OSC52
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: also save/restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# continuum: auto-save every 15 min, auto-restore on tmux server start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Keep this line at the very bottom of the file
run '~/.tmux/plugins/tpm/tpm'
